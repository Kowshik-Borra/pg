<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | PG Connect</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="bg-light">
    <div id="site-header"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card p-4">
                    <div class="text-center mb-4">
                        <h2 class="h4 fw-bold mb-1">Sign In to PG Connect</h2>
                        <p class="text-muted small">Access your discovery, booking, or management dashboard.</p>
                    </div>

                    <div class="alert alert-danger py-2 small" id="login-error" style="display: none;"></div>

                    <form id="login-form" onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <input type="email" class="form-control" id="login-email" required placeholder="name@example.com">
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label small fw-semibold">Password</label>
                            </div>
                            <input type="password" class="form-control" id="login-password" required placeholder="Enter password">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3" id="login-submit-btn">
                            Sign In
                        </button>
                    </form>

                    <div class="text-center small text-muted mb-4">
                        Don't have an account? <a href="/pages/register.html">Register here</a>
                    </div>

                    <!-- Evaluation Quick-Fill Buttons -->
                    <div class="border-top pt-3">
                        <div class="small fw-semibold text-muted mb-2 text-center">Demonstration One-Click Credentials</div>
                        <div class="d-grid gap-1">
                            <button class="btn btn-outline-secondary btn-sm text-start" onclick="fillCreds('admin@pgconnect.com', 'Admin@12345')">
                                <strong>Super Admin:</strong> admin@pgconnect.com
                            </button>
                            <button class="btn btn-outline-secondary btn-sm text-start" onclick="fillCreds('owner.rajesh@pgconnect.com', 'Owner@12345')">
                                <strong>PG Owner:</strong> owner.rajesh@pgconnect.com
                            </button>
                            <button class="btn btn-outline-secondary btn-sm text-start" onclick="fillCreds('manager.suresh@pgconnect.com', 'Manager@12345')">
                                <strong>PG Manager:</strong> manager.suresh@pgconnect.com
                            </button>
                            <button class="btn btn-outline-secondary btn-sm text-start" onclick="fillCreds('tenant.rahul@gmail.com', 'Tenant@12345')">
                                <strong>Tenant:</strong> tenant.rahul@gmail.com
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    <script>
        function fillCreds(email, password) {
            document.getElementById("login-email").value = email;
            document.getElementById("login-password").value = password;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById("login-submit-btn");
            const errDiv = document.getElementById("login-error");
            errDiv.style.display = "none";
            btn.disabled = true;

            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value;

            try {
                await Auth.login(email, password);
            } catch (err) {
                errDiv.innerText = err.message || "Invalid email or password.";
                errDiv.style.display = "block";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
