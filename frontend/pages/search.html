<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search PG Accommodation | PG Connect</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS for OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div id="site-header"></div>

    <div class="container py-4">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Explore PGs</li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h3 fw-bold mb-1">PG Accommodation Listings</h1>
                <p class="text-muted small mb-0" id="results-count-label">Loading properties...</p>
            </div>
            <button class="btn btn-outline-secondary btn-sm" onclick="toggleMapView()">
                <span id="map-toggle-text">Show Map View</span>
            </button>
        </div>

        <!-- Collapsible Interactive Map -->
        <div id="map-wrapper" class="mb-4" style="display: none;">
            <div id="leaflet-map"></div>
        </div>

        <div class="row g-4">
            <!-- Filter Sidebar -->
            <div class="col-lg-3">
                <div class="card p-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold mb-0">Filters</h6>
                        <button class="btn btn-link btn-sm p-0 text-muted" onclick="resetFilters()">Reset All</button>
                    </div>

                    <form id="filter-form" onsubmit="applyFilters(event)">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">City</label>
                            <input type="text" class="form-control" id="filter-city" placeholder="e.g. Bengaluru">
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Locality</label>
                            <input type="text" class="form-control" id="filter-locality" placeholder="e.g. Koramangala">
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Accommodation Type</label>
                            <select class="form-select" id="filter-gender">
                                <option value="">All</option>
                                <option value="BOYS">Boys PG</option>
                                <option value="GIRLS">Girls PG</option>
                                <option value="CO_ED">Co-Living</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Room Sharing</label>
                            <select class="form-select" id="filter-sharing">
                                <option value="">Any</option>
                                <option value="SINGLE">Single Sharing</option>
                                <option value="DOUBLE">Double Sharing</option>
                                <option value="TRIPLE">Triple Sharing</option>
                                <option value="FOUR">Four Sharing</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Rent Range (INR/month)</label>
                            <div class="row g-2">
                                <div class="col-6">
                                    <input type="number" class="form-control" id="filter-min-rent" placeholder="Min">
                                </div>
                                <div class="col-6">
                                    <input type="number" class="form-control" id="filter-max-rent" placeholder="Max">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Facilities</label>
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="filter-ac">
                                <label class="form-check-label small" for="filter-ac">Air Conditioning</label>
                            </div>
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="filter-wifi">
                                <label class="form-check-label small" for="filter-wifi">High-Speed Wi-Fi</label>
                            </div>
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="filter-verified" checked>
                                <label class="form-check-label small" for="filter-verified">Verified Properties Only</label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 btn-sm">Apply Filters</button>
                    </form>
                </div>
            </div>

            <!-- Property Listings Grid -->
            <div class="col-lg-9">
                <div class="row g-3" id="listings-grid">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                        <span class="ms-2 small text-muted">Searching database for matching accommodations...</span>
                    </div>
                </div>

                <!-- Pagination Container -->
                <nav class="mt-4" id="pagination-nav" style="display: none;">
                    <ul class="pagination pagination-sm justify-content-center" id="pagination-ul"></ul>
                </nav>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    <script>
        let mapInstance = null;
        let mapVisible = false;
        let currentPage = 1;

        document.addEventListener("DOMContentLoaded", () => {
            // Read query params from URL
            const params = new URLSearchParams(window.location.search);
            if (params.get("city")) document.getElementById("filter-city").value = params.get("city");
            if (params.get("locality")) document.getElementById("filter-locality").value = params.get("locality");
            if (params.get("gender")) document.getElementById("filter-gender").value = params.get("gender");
            if (params.get("sharing")) document.getElementById("filter-sharing").value = params.get("sharing");

            loadSearchResults();
        });

        async function loadSearchResults(page = 1) {
            currentPage = page;
            const grid = document.getElementById("listings-grid");
            grid.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                    <span class="ms-2 small text-muted">Loading accommodations...</span>
                </div>
            `;

            const queryParams = {
                page: currentPage,
                per_page: 9,
                city: document.getElementById("filter-city").value.trim(),
                locality: document.getElementById("filter-locality").value.trim(),
                gender: document.getElementById("filter-gender").value,
                sharing: document.getElementById("filter-sharing").value,
                min_rent: document.getElementById("filter-min-rent").value,
                max_rent: document.getElementById("filter-max-rent").value,
                has_ac: document.getElementById("filter-ac").checked ? "true" : "",
                has_wifi: document.getElementById("filter-wifi").checked ? "true" : "",
                verified_only: document.getElementById("filter-verified").checked ? "true" : ""
            };

            try {
                const res = await API.get("/properties/search", queryParams);
                if (!res.success || !res.data.items || res.data.items.length === 0) {
                    grid.innerHTML = `
                        <div class="col-12 empty-state card p-5">
                            <h5 class="fw-bold mb-2">No properties matched your criteria</h5>
                            <p class="text-muted small">Try broadening your search or resetting applied filters.</p>
                            <button class="btn btn-outline-primary btn-sm mx-auto" onclick="resetFilters()">Reset Filters</button>
                        </div>
                    `;
                    document.getElementById("results-count-label").innerText = "0 accommodations found";
                    document.getElementById("pagination-nav").style.display = "none";
                    return;
                }

                document.getElementById("results-count-label").innerText = `Showing ${res.data.items.length} of ${res.data.total} verified accommodations`;

                grid.innerHTML = res.data.items.map(p => `
                    <div class="col-md-6 col-lg-4">
                        <div class="property-card h-100 d-flex flex-column">
                            <div class="position-relative">
                                <img src="${p.photos && p.photos.length > 0 ? p.photos[0].file_path : 'https://images.unsplash.com/photo-1555854877-bab0e564b8d5?auto=format&fit=crop&w=600&q=80'}"
                                     class="property-card-img" alt="${p.name}">
                                <span class="position-absolute top-0 end-0 m-2 badge ${p.is_verified ? 'badge-verified' : 'bg-secondary'}">
                                    ${p.is_verified ? 'Verified' : 'Unverified'}
                                </span>
                            </div>
                            <div class="property-card-body d-flex flex-column flex-grow-1">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="badge bg-light text-dark border">${p.property_type}</span>
                                    <span class="badge ${p.available_beds > 0 ? 'badge-available' : 'badge-occupied'}">
                                        ${p.available_beds > 0 ? p.available_beds + ' Beds Available' : 'Occupied'}
                                    </span>
                                </div>
                                <h6 class="fw-bold mb-1 text-truncate">${p.name}</h6>
                                <p class="text-muted small mb-2 text-truncate">${p.locality}, ${p.city}</p>

                                <div class="small text-muted mb-2">
                                    Rooms: ${p.total_rooms} | Total Beds: ${p.total_beds}
                                </div>

                                <div class="mt-auto pt-2 border-top d-flex justify-content-between align-items-center">
                                    <div>
                                        <div class="small text-muted" style="font-size: 0.75rem;">Starts at</div>
                                        <div class="property-card-price">${formatCurrency(p.min_rent)}<span class="text-muted fw-normal" style="font-size: 0.75rem;">/mo</span></div>
                                    </div>
                                    <a href="/pages/pg-details.html?id=${p.id}" class="btn btn-outline-primary btn-sm">
                                        Details
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join("");

                renderPagination(res.data.page, res.data.pages);
                updateMapMarkers(res.data.items);
            } catch (err) {
                grid.innerHTML = `
                    <div class="col-12 empty-state text-danger">
                        <p>Error retrieving accommodation listings.</p>
                    </div>
                `;
            }
        }

        function renderPagination(current, totalPages) {
            const nav = document.getElementById("pagination-nav");
            const ul = document.getElementById("pagination-ul");
            if (totalPages <= 1) {
                nav.style.display = "none";
                return;
            }
            nav.style.display = "block";
            let html = "";
            for (let i = 1; i <= totalPages; i++) {
                html += `
                    <li class="page-item ${i === current ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="loadSearchResults(${i}); return false;">${i}</a>
                    </li>
                `;
            }
            ul.innerHTML = html;
        }

        function applyFilters(e) {
            e.preventDefault();
            loadSearchResults(1);
        }

        function resetFilters() {
            document.getElementById("filter-city").value = "";
            document.getElementById("filter-locality").value = "";
            document.getElementById("filter-gender").value = "";
            document.getElementById("filter-sharing").value = "";
            document.getElementById("filter-min-rent").value = "";
            document.getElementById("filter-max-rent").value = "";
            document.getElementById("filter-ac").checked = false;
            document.getElementById("filter-wifi").checked = false;
            document.getElementById("filter-verified").checked = true;
            loadSearchResults(1);
        }

        function toggleMapView() {
            const wrapper = document.getElementById("map-wrapper");
            const btnText = document.getElementById("map-toggle-text");
            mapVisible = !mapVisible;
            if (mapVisible) {
                wrapper.style.display = "block";
                btnText.innerText = "Hide Map View";
                if (!mapInstance) {
                    initMap();
                } else {
                    setTimeout(() => mapInstance.invalidateSize(), 200);
                }
            } else {
                wrapper.style.display = "none";
                btnText.innerText = "Show Map View";
            }
        }

        function initMap() {
            // Default center Bengaluru
            mapInstance = L.map('leaflet-map').setView([12.9716, 77.5946], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: 'OpenStreetMap contributors'
            }).addTo(mapInstance);
        }

        function updateMapMarkers(items) {
            if (!mapInstance) return;
            // Clear existing markers if any
            mapInstance.eachLayer((layer) => {
                if (layer instanceof L.Marker) {
                    mapInstance.removeLayer(layer);
                }
            });

            const bounds = [];
            items.forEach(p => {
                if (p.latitude && p.longitude) {
                    const lat = parseFloat(p.latitude);
                    const lng = parseFloat(p.longitude);
                    bounds.push([lat, lng]);

                    const marker = L.marker([lat, lng]).addTo(mapInstance);
                    marker.bindPopup(`
                        <div style="min-width: 180px;">
                            <strong>${p.name}</strong><br>
                            <span class="text-muted small">${p.locality}, ${p.city}</span><br>
                            <span class="badge ${p.available_beds > 0 ? 'badge-available' : 'badge-occupied'} my-1">
                                ${p.available_beds} beds available
                            </span><br>
                            <strong>${formatCurrency(p.min_rent)}/mo</strong><br>
                            <a href="/pages/pg-details.html?id=${p.id}" class="btn btn-primary btn-sm mt-2 text-white w-100" style="padding: 2px 8px; font-size: 0.8rem;">View PG</a>
                        </div>
                    `);
                }
            });

            if (bounds.length > 0) {
                mapInstance.fitBounds(bounds, { padding: [30, 30] });
            }
        }
    </script>
</body>
</html>
